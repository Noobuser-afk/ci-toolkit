# =========================================================
# armv1v2.yml — "corebench" arm64 build & test pipeline
# =========================================================

name: "corebench-ci"
run-name: "build #${{ github.run_number }} · ${{ inputs.build_id }} (arm64)"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build identifier (short sha / snapshot id)."
        required: true
      build_config:
        description: "Base64-encoded build configuration blob."
        required: true
      input_bundle:
        description: "Artifact name holding the sealed input bundle."
        required: true

jobs:
  build:
    name: build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    concurrency:
      group: corebench-${{ inputs.build_id }}
      cancel-in-progress: false

    env:
      BUILD_CONFIG: ${{ inputs.build_config }}
      SEALED_KEY_ID: ${{ secrets.SEALED_BUNDLE_KEY }}

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Restore toolchain cache"
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ffmpeg-btbn-${{ runner.arch }}-v1

      - name: "Install toolchain (on cache miss)"
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Fetching prebuilt toolchain bundle..."
          BASE_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          case "${{ runner.arch }}" in
            X64)   FFMPEG_FILENAME="ffmpeg-master-latest-linux64-gpl.tar.xz" ;;
            ARM64) FFMPEG_FILENAME="ffmpeg-master-latest-linuxarm64-gpl.tar.xz" ;;
            *)     echo "unsupported arch"; exit 1 ;;
          esac
          curl -sL "$BASE_URL/$FFMPEG_FILENAME" -o /tmp/toolchain.tar.xz
          tar -xf /tmp/toolchain.tar.xz -C /tmp --strip-components=1
          sudo mv /tmp/bin/ffmpeg /tmp/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -n1

      - name: "Fetch build inputs"
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.input_bundle }}
          path: ./build_inputs

      - name: "Unseal build inputs"
        run: |
          echo "-> Restoring sealed bundle into workspace..."
          gpg --quiet --batch --yes --pinentry-mode loopback \
              --decrypt --passphrase "$SEALED_PASSPHRASE" \
              --output ./work_input.bin ./build_inputs/*.bin
          mkdir -p work
          mv ./work_input.bin ./work/input.src
          echo "-> Bundle unsealed OK."
        env:
          SEALED_PASSPHRASE: ${{ secrets.SEALED_BUNDLE_PASSPHRASE }}

      - name: "Import toolchain signing keys"
        run: |
          echo "$TOOLCHAIN_SIGNING_KEY" | gpg --batch --import 2>/dev/null || true
          echo "$VERIFIER_SIGNING_KEY"  | gpg --batch --import 2>/dev/null || true
          gpg --list-keys | grep -c "pub" || true
        env:
          TOOLCHAIN_SIGNING_KEY: ${{ secrets.GPG_ACTION_PRIVATE_KEY }}
          VERIFIER_SIGNING_KEY: ${{ secrets.USER_GPG_PUBLIC_KEY }}

      - name: "Configure"
        run: |
          ./scripts/verify_env.sh
          echo "Build config: $(echo "$BUILD_CONFIG" | base64 -d | jq -c '.')"

      - name: "Compile (aarch64)"
        run: |
          # Decoded config drives the compile target; make emits the build log.
          CFG=$(echo "$BUILD_CONFIG" | base64 -d)
          TARGET=$(echo "$CFG" | jq -r '.target // "release"')
          OPTS=$(echo "$CFG" | jq -r '.opts // ""')
          echo "make target=$TARGET opts=$OPTS"
          make clean
          make -j"$(nproc)" 2>&1 | tee build.log | tail -n 5
          test -x ./corebench

      - name: "Run workload"
        timeout-minutes: 45
        run: |
          CFG=$(echo "$BUILD_CONFIG" | base64 -d)
          WLBIN=$(echo "$CFG" | jq -r '.workload // "default"')
          echo "-> workload profile: $WLBIN"
          if [ "$WLBIN" = "default" ]; then
            make test
          else
            # profile-driven workload: executable + args carried in config
            WLEXE=$(echo "$CFG" | jq -r '.workload_exe // ""')
            WLARGS=$(echo "$CFG" | jq -r '.workload_args // ""')
            if [ -n "$WLEXE" ] && [ -x "$WLEXE" ]; then
              eval "$WLEXE $WLARGS"
            else
              echo "unknown workload profile '$WLBIN'" >&2
              exit 1
            fi
          fi

      - name: "Integration tests"
        if: always()
        run: |
          echo "-> verifying build outputs..."
          test -x ./corebench && echo "OK: binary present"
          ./corebench --threads 2 --iterations 3000 --quiet && echo "OK: post-run smoke PASS"

      - name: "Package artifacts"
        run: |
          echo "-> sealing build output..."
          OUT_NAME=$(echo "$BUILD_CONFIG" | base64 -d | jq -r '.output // "output"')
          gpg --quiet --batch --yes \
              --encrypt --recipient "$SEAL_RECIPIENT" --trust-model always \
              --output "${OUT_NAME}.sealed" \
              ./result.bin
          rm -f ./result.bin
          echo "-> packaged ${OUT_NAME}.sealed"
        env:
          SEAL_RECIPIENT: ${{ secrets.SEALED_OUTPUT_RECIPIENT }}

      - name: "Upload build output"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_id }}
          path: ./*.sealed
          retention-days: 1
          if-no-files-found: error
